name: Investigation checks
on: [push, pull_request]
jobs:
  local-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scientific/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scientific/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s scientific/tests -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Saved investigation workflow
        run: |
          SIGNAL1_DATA_DIR="$RUNNER_TEMP/signal1-data" npm start > "$RUNNER_TEMP/signal1-server.log" 2>&1 &
          node scripts/verify-api.mjs
        env:
          SIGNAL1_URL: http://127.0.0.1:3000
